  #   ports:
  #     - "80:80"
  #     - "8090:8080"
  #   command:
  #     - --providers.docker
  #     - --providers.docker.constraints=Label(`traefik.constraint-label`, `traefik-public`)
  #     - --providers.docker.exposedbydefault=false
  #     - --entrypoints.http.address=:80
  #     - --entrypoints.https.address=:443
  #     - --accesslog
  #     - --log
  #     - --log.level=DEBUG
  #     - --api
  #     - --api.insecure=true
  #   labels:
  #     - traefik.enable=true
  #     - traefik.constraint-label=traefik-public
  #     - traefik.http.middlewares.https-redirect.contenttype.autodetect=false
  #   networks:
  #     - traefik-public
  #     - default

  db:
    restart: "no"
    ports:
      - "5433:5432"

  adminer:
    restart: "no"
    ports:
      - "8080:8080"

  backend:
    restart: "no"
    ports:
      - "8001:8000"
    build:
      context: .
      dockerfile: backend/Dockerfile
    # command: sleep infinity  # Infinite loop to keep container alive doing nothing
    command:
      - fastapi
      - run
      - --reload
      - "app/main.py"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - ./backend/.venv
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
    # TODO: remove once coverage is done locally
    volumes:
      - ./backend/htmlcov:/app/backend/htmlcov
    # environment:  # mailcatcher SMTP disabled
    #   SMTP_HOST: "mailcatcher"
    #   SMTP_PORT: "1025"
    #   SMTP_TLS: "false"
    #   EMAILS_FROM_EMAIL: "noreply@example.com"

  # mailcatcher:  # Disabled — not needed for local dev unless testing emails
  #   image: schickling/mailcatcher
  #   ports:
  #     - "1080:1080"
  #     - "1025:1025"

  frontend:
    restart: "no"
    ports:
      - "5173:5173"
    image: node:20-slim
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - VITE_API_URL=http://localhost:8001
      - NODE_ENV=development
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules

  playwright:
    profiles:
      - test
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        - VITE_API_URL=http://backend:8000
        - NODE_ENV=production
    ipc: host
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://backend:8000
      - MAILCATCHER_HOST=http://mailcatcher:1080
      # For the reports when run locally
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI}
    volumes:
      - ./frontend/blob-report:/app/frontend/blob-report
      - ./frontend/test-results:/app/frontend/test-results
    ports:
      - 9323:9323

networks:
  traefik-public:
    # For local dev, don't expect an external Traefik network
    external: false
